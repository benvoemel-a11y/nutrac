<style>
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
input[type=date]{font-size:16px!important}
body{margin:0;font-size:14px;box-sizing:border-box;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img{max-width:100%}
/* Layout: drei Seiten nebeneinander, horizontal geschoben (Heute · Gewicht · Profil), Punkte unten – Filer/physis-Grau, eine bewusste Optik */
:root{
  --bg:#8b8b8b;
  --card:#959595;
  --card-2:#9e9e9e;
  --line:#7c7c7c;
  --track:#7a7a7a;
  --fg:#1d1d1d;
  --muted:#3f3f3f;
  --faint:#5f5f5f;
  --knob:#c8c8c8;
  --ink:#1f1f1f;
  --alert:#d93f37;
  --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  --bg0:rgba(139,139,139,0);
}
:root[data-theme="dunkel"]{
  --bg:#131313;
  --card:#1d1d1d;
  --card-2:#262626;
  --line:#323232;
  --track:#2e2e2e;
  --fg:#ececec;
  --muted:#a6a6a6;
  --faint:#787878;
  --knob:#131313;
  --ink:#ececec;
  --alert:#e5524a;
  --bg0:rgba(19,19,19,0);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
html{background:var(--bg)!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
.viewport{flex:1;min-height:0;overflow:hidden;position:relative}
.page{scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.track{display:flex;height:100%;transition:transform .42s cubic-bezier(.2,.9,.25,1);will-change:transform}
.page{flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:8px 96px;box-sizing:border-box}
.page-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* Kopf */
.head{display:flex;align-items:center;gap:10px;min-height:52px}
.head h1{font-family:var(--mono);font-weight:600;font-size:clamp(15px,4.3vw,21px);letter-spacing:.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{font-family:var(--mono);font-size:22px;color:var(--faint);width:24px;height:40px;display:grid;place-items:center}
.datebox{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.datebox h1{flex:0 1 auto}
.circle{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--muted)}
.circle svg{width:22px;height:22px}
.gear svg{transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.wordmark{font-family:var(--mono);font-weight:600;font-size:20px;color:var(--wm,var(--fg));border:1.5px solid var(--wm,var(--muted));border-radius:12px;padding:6px 16px;letter-spacing:.01em;transition:color .25s,border-color .25s}
.daterow{margin-top:-10px;gap:2px}
.daterow h1{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--muted);margin:0;white-space:nowrap;cursor:pointer}
.daterow .arrow{width:26px;height:32px;font-size:18px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;color:var(--muted)}
.swatches button i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
.swatches button[aria-pressed="true"]{border-color:var(--ink);color:var(--fg)}

/* Personenwahl */
.who{display:flex;gap:6px;flex-wrap:wrap}
.who:empty{display:none}
.who button{font-family:var(--mono);font-size:13px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.who button[aria-pressed="true"]{border-color:var(--ink);color:var(--fg)}

/* Fortschritt */
.progress{display:flex;align-items:center;gap:18px}
.bar{flex:1;height:8px;background:var(--track);border-radius:1px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);width:0;transition:width .5s cubic-bezier(.22,.8,.24,1)}
.bar.over>i{background:var(--alert)}
.pct{font-family:var(--mono);font-size:15px;color:var(--muted);min-width:52px;text-align:right}

.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big .lab{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.big .val{font-family:var(--mono);font-size:clamp(32px,10vw,44px);font-weight:500;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big .unit{font-family:var(--mono);font-size:13px;color:var(--muted)}
.big .over{color:var(--alert)}
.sub{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--card);border-radius:20px;padding:16px 18px}
.card.flush{padding:0;overflow:hidden}
.card-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card-title h2{font-family:var(--mono);font-weight:500;font-size:20px;margin:0}
.card-title span{font-size:13px;color:var(--faint)}

.macros{display:grid;gap:12px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ring{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.ring .rw{position:relative;width:100%;max-width:108px;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .bg{fill:none;stroke:var(--track);stroke-width:7}
.ring .fg{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.22,.8,.24,1)}
.ring .fg.over{stroke:var(--alert)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.15}
.ring .c b{font-size:clamp(17px,5vw,21px);font-weight:600}
.ring .c small{font-size:11px;color:var(--faint)}
.ring .l{font-size:13px;color:var(--muted)}
.macro{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:12px}
.wcard{display:grid;gap:10px;cursor:pointer}
.wrow{display:flex;align-items:center;gap:14px}
.wrow .wv{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.02em;white-space:nowrap}
.wrow .wv small{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}
.spark{flex:1 1 0;width:0;min-width:0;height:44px;display:block}
.spark .ln{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark .ar{fill:var(--ink);fill-opacity:.07}
.wrow .circle{width:40px;height:40px}
.check{display:flex;gap:12px;align-items:center;font-size:15px;text-align:left}
.check i{width:22px;height:22px;border:1.5px solid var(--muted);border-radius:7px;display:grid;place-items:center;flex:none;box-sizing:border-box}
.check[aria-pressed="true"] i{background:var(--ink);border-color:var(--ink)}
.check[aria-pressed="true"] i::after{content:"";width:5px;height:10px;border:solid var(--knob);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.sec h4{font-family:var(--mono);font-weight:500;font-size:16px;margin:0}
.sec span{font-size:12px;color:var(--faint)}
.wblock{display:grid;gap:6px}
.wblock .wnow .val{font-size:clamp(32px,10vw,40px)}
.wblock .chart{margin-top:4px}
.wact{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wact .lnk{font-family:var(--mono);font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.wact .circle{width:42px;height:42px}
.prow{grid-template-columns:auto 1fr auto}
.tick{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);box-sizing:border-box;display:grid;place-items:center}
.tick.on{background:var(--ink);border-color:var(--ink)}
.tick.on::after{content:"";width:5px;height:10px;border:solid var(--knob);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.prow.done .n{color:var(--faint);text-decoration:line-through}
.plan-h{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 4px}
.plan-h h2{font-family:var(--mono);font-weight:500;font-size:16px;margin:0}
.plan-h span{font-size:12px;color:var(--faint)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{border:1.5px solid var(--line);border-radius:10px;padding:9px 0;font-family:var(--mono);font-size:13px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--knob)}
.rtrow{display:grid;grid-template-columns:1fr auto;align-items:center;border-top:1.5px solid var(--line)}
.rtrow:first-child{border-top:0}
.rtrow .row{border-top:0}
.rtrow .ed{width:44px;height:44px;margin-right:12px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.rtrow .ed svg{width:20px;height:20px}
.fcard{display:grid;gap:16px;cursor:pointer;text-align:left}
.ftop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fname{font-family:var(--mono);font-weight:600;font-size:20px}
.fmeta{font-size:12px;color:var(--faint);text-align:right}
.fk{display:grid;gap:8px}
.fk .fv{font-family:var(--mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.fk .fv small{font-size:13px;color:var(--muted);font-weight:400}
.rings.sm .ring .rw{max-width:78px}
.rings.sm .ring .c b{font-size:15px}
.fsec{display:grid;gap:6px;border-top:1.5px solid var(--line);padding-top:14px}
.fsec .lab{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.fline{font-size:14px;color:var(--muted);line-height:1.45}
.fempty{font-size:14px;color:var(--muted)}
.chart.sm{height:120px;margin-top:0}
[hidden]{display:none!important}
.blk{display:flex;flex-direction:column;gap:18px}
.blk[data-off]{display:none}
.sheet-top{gap:12px}
.sheet-top h3{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:46px;height:46px;border-radius:50%;background:var(--knob);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink);flex:none}
.back svg{width:20px;height:20px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px solid var(--line);transition:transform .18s cubic-bezier(.22,.8,.24,1);background:var(--card);position:relative}
.lrow.dragging{transition:none;z-index:3;border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.18);border-top-color:transparent}
.grip{width:44px;height:44px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:none;border-radius:12px}
.grip:active{cursor:grabbing}
.grip svg{width:20px;height:20px}
.lrow:first-child{border-top:0}
.lrow .check{flex:1}
.lrow .check:disabled{opacity:.6}
.mv{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.mv svg{width:16px;height:16px}
.mv:disabled{opacity:.3}
.goalc{display:grid;gap:12px}
.gbig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gbig .val{font-family:var(--mono);font-size:clamp(32px,10vw,40px);font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gbig .unit{font-family:var(--mono);font-size:13px;color:var(--muted)}
.gcalc{display:grid}
.goalc{cursor:pointer}
.gtog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.gtog svg{width:16px;height:16px;transition:transform .25s}
.goalc[aria-expanded="true"] .gtog svg{transform:rotate(180deg)}
.gdet{display:grid;gap:12px}
.gcalc div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1.5px solid var(--line);font-size:14px}
.gcalc div:first-child{border-top:0}
.gcalc .num{font-size:14px;text-align:right;white-space:nowrap}
.gcalc small{display:block;font-size:12px;color:var(--faint)}
.reqrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1.5px solid var(--line);padding-top:12px}
.reqrow .rq{flex:1;min-width:150px}
.reqrow .rq b{display:block;font-weight:500;font-size:16px}
.reqrow .rq small{display:block;font-size:13px;color:var(--faint);margin-top:2px}
.reqrow .rqb{display:flex;gap:8px}
.reqrow .btn{width:auto;padding:10px 14px;font-size:14px}
#splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .wordmark{font-size:24px}
.sbar{width:120px;height:3px;background:var(--track);border-radius:3px;overflow:hidden}
.sbar i{display:block;width:40%;height:100%;background:var(--ink);border-radius:3px;animation:sbar 1s ease-in-out infinite alternate}
@keyframes sbar{from{transform:translateX(-20%)}to{transform:translateX(170%)}}
#invite{position:fixed;inset:0;z-index:40;background:#fff;color:#111;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 18vh) 28px calc(env(safe-area-inset-bottom,0px) + 28px);box-sizing:border-box}
#invite[hidden]{display:none}
.iv-ic{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
#invite h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:30px 0 0;line-height:1.15}
#invite p{font-size:17px;color:#6e6e73;margin:12px 0 0;line-height:1.4}
.iv-foot{margin-top:auto;width:100%;max-width:420px}
.iv-btn{width:100%;background:#111;color:#fff;border-radius:999px;padding:17px;font-size:17px;font-weight:600}
.iv-alt{margin-top:16px;color:#6e6e73;font-size:15px}
.iv-btn:active,.iv-alt:active{opacity:.7}
.frbtn{position:relative}
.frbtn.badge::after{content:"";position:absolute;top:4px;right:4px;width:11px;height:11px;border-radius:50%;background:var(--alert);border:2px solid var(--bg)}
.botfade{position:absolute;left:0;right:0;bottom:0;height:calc(28px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,var(--bg0),var(--bg));pointer-events:none;z-index:2}
.dots button{position:relative}
.dots button.badge::after{content:"";position:absolute;top:9px;right:18px;width:9px;height:9px;border-radius:50%;background:var(--alert)}
/* Tipp-Feedback: kurz eindrücken statt dunkler Fläche */
.btn,.opt,.circle,.row,.chip,.seg button,.tabs button,.dots button,.x,.back,.check,.swatches button,.days button,.who button,.lnk,.later,.linkdanger,.arrow{transition:transform .16s cubic-bezier(.3,.7,.4,1),opacity .16s,background-color .2s,color .2s,border-color .2s}
.btn:active,.opt:active,.circle:active,.chip:active,.seg button:active,.tabs button:active,.x:active,.back:active,.swatches button:active,.days button:active,.arrow:active{transform:scale(.95)}
.row:active{transform:scale(.985)}
.dots button:active i{transform:scale(.8)}
.dots i{transition:background .25s,transform .2s}
.check:active i{transform:scale(.85)}
.check i{transition:background .15s,border-color .15s,transform .15s}
.sheet-body>*{flex-shrink:0;animation:sheetIn .32s cubic-bezier(.2,.9,.25,1) both}
.sheet-body>*:nth-child(2){animation-delay:.03s}.sheet-body>*:nth-child(3){animation-delay:.06s}.sheet-body>*:nth-child(4){animation-delay:.09s}.sheet-body>*:nth-child(n+5){animation-delay:.12s}
@keyframes sheetIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast{transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.25,1)}

.addfoot{display:flex;justify-content:center;padding-top:2px}
.dots::before{content:"";position:absolute;left:0;right:0;top:-28px;height:28px;background:linear-gradient(to bottom,var(--bg0),var(--bg));pointer-events:none}

.macro b{font-weight:400;font-size:14px}
.macro .bar{height:6px}

.fab{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:5;transition:transform .3s cubic-bezier(.22,.8,.24,1),opacity .2s}

.chart .sl{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}

.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--ink);fill-opacity:.07}
.chart .pt{fill:var(--ink)}

.form{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.calc{display:grid;gap:0}
.calc div{display:flex;justify-content:space-between;padding:12px 0;border-top:1.5px solid var(--line);font-size:15px}
.calc div:first-child{border-top:0}

/* Blatt */

.opt{display:flex;align-items:center;gap:14px;border:1.5px solid var(--muted);border-radius:16px;padding:14px 16px;text-align:left;width:100%;box-sizing:border-box;cursor:pointer;position:relative}

.opt b{display:block;font-weight:500;font-size:16px}
.opt small{display:block;font-size:13px;color:var(--faint);margin-top:2px}
.opt.off{opacity:.5;pointer-events:none}
.opt input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.thumb{width:100%;max-height:220px;object-fit:cover;border-radius:16px;filter:grayscale(1) contrast(1.05)}
.reading{font-family:var(--mono);font-size:14px;color:var(--muted)}
.reading::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.result{font-family:var(--mono);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.result strong{font-size:30px;font-weight:600}

.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--ink);color:var(--knob);font-family:var(--mono);font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;transition:all .3s;z-index:30;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px}

.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet.drag{transition:none}
.sw{position:relative;overflow:hidden;border-top:1.5px solid var(--line)}
.list>.sw:first-child{border-top:0}
.sw>.row{border-top:0;background:var(--card);position:relative;z-index:1;transition:transform .25s cubic-bezier(.22,.8,.24,1);touch-action:pan-y}
.sw.drag>.row{transition:none}
.swdel{position:absolute;right:0;top:0;bottom:0;width:96px;background:var(--alert);color:#fff;font-family:var(--mono);font-size:14px;font-weight:500}
.bkp{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bkp .t{flex:1;min-width:160px;font-size:14px;line-height:1.4}
.bkp .t b{display:block;font-family:var(--mono);font-weight:600;font-size:15px}
.bkp .btn{width:auto;padding:10px 16px;font-size:14px}
.bkp .later{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);

const BLOCKS=[["kcal","Kalorien"],["macros","Makros"],["weight","Gewicht"],["goal","Zielgewicht"],["plan","Routinen"],["entries","Einträge + Hinzufügen"]];
const KCAL_PER_KG=7000;
const APP_VERSION="29";
const WM_COLORS=[["schwarz","Schwarz","#1d1d1d"],["weiss","Weiß","#ffffff"],["rot","Rot","#b8202e"],["pink","Pink","#e0559a"],["gelb","Gelb","#f2c230"],["gruen","Grün","#2f9e55"],["orange","Orange","#ee7b22"],["blau","Blau","#2f6fd6"]];
function applyWordmark(key){const c=WM_COLORS.find(x=>x[0]===key)||WM_COLORS[0];const dk=document.documentElement.dataset.theme==="dunkel";document.documentElement.style.setProperty("--wm",dk&&c[0]==="schwarz"?"var(--fg)":(!dk&&c[0]==="weiss"?"#f4f4f4":c[2]));const light=c[0]==="weiss"||c[0]==="gelb"||(dk&&c[0]==="schwarz");document.documentElement.style.setProperty("--wm-on",light?"#151515":"#f4f4f4");try{localStorage.setItem("nutrac-wm",getComputedStyle(document.documentElement).getPropertyValue("--wm").trim().startsWith("var")?(dk?"#ececec":c[2]):(dk&&c[0]==="schwarz"?"#ececec":(!dk&&c[0]==="weiss"?"#f4f4f4":c[2])))}catch(e){}}
const THEMES=[["grau","Grau"],["dunkel","Dunkel"]];

  let rt=null;const refresh=()=>{clearTimeout(rt);rt=setTimeout(()=>subs.forEach(o=>o.run()),60)};
  const q=async p=>{const {data,error}=await p;if(error)throw error;return data||[]};
  const w=async p=>{const {error}=await p;if(error)throw error;refresh()};
  const T=()=>sb.from("docs");

  const asDoc=r=>({id:r.id,...(r.data||{})});
  const uuid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));

  const del=(uid,col,id)=>w(T().delete().match({user_id:uid,col,id}));

    init(client){

      try{sb.channel("nutrac").on("postgres_changes",{event:"*",schema:"public",table:"docs"},()=>refresh())
        .on("postgres_changes",{event:"*",schema:"public",table:"friend_requests"},()=>refresh())
        .on("postgres_changes",{event:"*",schema:"public",table:"friends"},()=>refresh()).subscribe()}catch(e){}
    },
    get shared(){return true},
    refresh,
    users(cb){return sub(async()=>{const r=await q(T().select("user_id,data").eq("col","profile"));const o={};r.forEach(x=>o[x.user_id]=x.data||{});return o},cb)},
    food(uid,day,cb){return sub(async()=>(await q(sel(uid,"food").eq("date",day))).map(asDoc),cb)},
    async foodRange(uid,from,to){return (await q(sel(uid,"food").gte("date",from).lte("date",to))).map(asDoc)},
    foodSince(uid,from,cb){return sub(async()=>(await q(sel(uid,"food").gte("date",from))).map(asDoc),cb)},
    weights(uid,cb){return sub(async()=>(await q(sel(uid,"weight"))).map(r=>r.data).filter(x=>x&&x.date),cb)},
    meals(uid,cb){return sub(async()=>(await q(sel(uid,"meals"))).map(asDoc),cb)},

    saveProfile(uid,p){return put(uid,"profile","me",null,p)},
    addFood(uid,e){return put(uid,"food",uuid(),e.date,e)},
    setEntry(uid,id,e){return put(uid,"food",id,e.date,e)},
    delFood(uid,id){return del(uid,"food",id)},
    setWeight(uid,date,kg){return put(uid,"weight",date,date,{date,kg})},
    delWeight(uid,date){return del(uid,"weight",date)},
    addMeal(uid,m){return put(uid,"meals",uuid(),null,m)},
    delMeal(uid,id){return del(uid,"meals",id)},
    setRoutine(uid,id,r){return put(uid,"routines",id||uuid(),null,r)},
    delRoutine(uid,id){return del(uid,"routines",id)},
    async dump(uid){
      const r=await q(T().select("col,id,data").eq("user_id",uid));

function plan(p,weightKg){
  if(!p) return null;
  const w=weightKg||num(p.weight),h=num(p.height),a=num(p.age);
  if(!w||!h||!a) return null;
  const bmr=10*w+6.25*h-5*a+(p.sex==="w"?-161:5);
  const stepMode=p.actMode==="steps";
  const tdee=bmr*(stepMode?1.2:num(p.act||1.375));
  const d=p.goal==="keep"?0:num(p.delta??500);
  const target=Math.round(p.goal==="lose"?tdee-d:p.goal==="gain"?tdee+d:tdee);
  const prot=Math.round(w*num(p.protKg||1.8));
  const fat=Math.round(target*num(p.fatPct||25)/100/9);
  const carbs=num(p.carbG)>0?Math.round(num(p.carbG)):Math.max(0,Math.round((target-prot*4-fat*9)/4));
  const stepK=n=>Math.round(num(n)*w*0.0005);
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),target,prot,fat,carbs,w,d,stepMode,stepK,stepsDefault:num(p.stepsDefault)};
}
function latestWeight(ws){if(!ws.length)return 0;return[...ws].sort((a,b)=>a.date<b.date?1:-1)[0].kg}

const WD=["Mo","Di","Mi","Do","Fr","Sa","So"];

function goalCalc(p,ws,hist){
  if(!p||!num(p.goalKg)||!(num(p.startKg)||num(p.weight)))return null;
  const pl=plan(p,latestWeight(ws));if(!pl)return null;
  const startKg=num(p.startKg)||num(p.weight),goalKg=num(p.goalKg);
  const dir=goalKg<startKg?1:-1; // 1 = abnehmen
  const today=keyOf(new Date());
  const startDate=p.startDate||today;
  const byDay={};hist.forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e)});
  const dayDef=k=>{const es=byDay[k]||[];if(!es.some(e=>e.kind!=="sport"))return null;
    const st=dayStats(es);return dir*(pl.tdee+st.burned+stepsOf(pl,st).k-st.eaten)};
  const sumRange=(from,to)=>{let sum=0,n=0;const d=parseKey(from),end=parseKey(to);
    while(d<=end){const v=dayDef(keyOf(d));if(v!=null){sum+=v;n++}d.setDate(d.getDate()+1)}return{sum:Math.round(sum),n}};
  const y=new Date();y.setDate(y.getDate()-1);const yk=keyOf(y);
  const mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7));let mk=keyOf(mon);if(mk<startDate)mk=startDate;
  const tk=today;
  const since=startDate<=tk?sumRange(startDate,tk):{sum:0,n:0};
  const week=mk<=tk?sumRange(mk,tk):{sum:0,n:0};
  const todayDef=dayDef(tk);
  const total=Math.round(Math.abs(startKg-goalKg)*KCAL_PER_KG);
  const remaining=Math.max(0,total-since.sum);
  const pct=total>0?Math.max(0,Math.min(100,since.sum/total*100)):100;
  const cur=latestWeight(ws);
  const rate=p.goal==="keep"?0:pl.d;
  return{startKg,goalKg,startDate,dir,total,since,week,todayDef,done:Math.max(0,since.sum),remaining,pct,cur,days:rate>0?Math.ceil(remaining/rate):null,reached:total===0||remaining===0};
}

function sparkPath(ws,W,H){
  const lo=Math.min(...ws.map(w=>w.kg)),hi=Math.max(...ws.map(w=>w.kg)),rg=Math.max(.6,hi-lo);
  const t0=parseKey(ws[0].date).getTime(),t1=parseKey(ws[ws.length-1].date).getTime();
  return ws.map((w,i)=>(i?"L":"M")+(((parseKey(w.date).getTime()-t0)/Math.max(1,t1-t0))*W).toFixed(1)+" "+(4+(hi-w.kg+(rg-(hi-lo))/2)/rg*(H-8)).toFixed(1)).join(" ");
}
function weightSummary(ws){
  const s=[...ws].sort((a,b)=>a.date<b.date?-1:1);const last=s[s.length-1];
  if(!last)return{last:null,text:"noch keine Einträge",sorted:s};
  if(s.length<2)return{last,text:"erster Eintrag",sorted:s};
  const cutK=(()=>{const c=new Date();c.setDate(c.getDate()-30);return keyOf(c)})();
  const rec=s.filter(w=>w.date>=cutK);const base=rec.length>1?rec[0]:s[0];
  const d=last.kg-base.kg;
  return{last,sorted:s,text:`${d>0?"+":d<0?"−":"±"} ${fw(Math.abs(d))} ${UNIT()} seit ${parseKey(base.date).toLocaleDateString("de-DE",{day:"numeric",month:"short"})}`};
}
function renderWeight(){

function drawChart(all,svg,range,H){
  svg=svg||$("#chart");H=H||200;all=all.map(w=>({date:w.date,kg:toU(w.kg)}));
  const W=Math.max(240,svg.clientWidth||320);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  let ws=all;
  if(range){const cut=new Date();cut.setDate(cut.getDate()-range);const ck=keyOf(cut);ws=all.filter(w=>w.date>=ck)}
  if(ws.length<2){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle">${ws.length?"ab zwei Einträgen entsteht der Graph":"noch keine Einträge"}</text>`;return}
  const L=46,R=12,T=12,B=26;
  const t0=parseKey(ws[0].date).getTime(),t1=parseKey(ws[ws.length-1].date).getTime();
  let lo=Math.min(...ws.map(w=>w.kg)),hi=Math.max(...ws.map(w=>w.kg));
  lo=Math.floor(lo-.5);hi=Math.ceil(hi+.5);if(hi-lo<2){hi+=1;lo-=1}
  const x=t=>L+(t1===t0?0:(t-t0)/(t1-t0))*(W-L-R);
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const mid=(lo+hi)/2;
  let g="";
  [hi,mid,lo].forEach(v=>{g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${fmt(v,v%1?1:0)}</text>`});
  const pts=ws.map(w=>[x(parseKey(w.date).getTime()),y(w.kg)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  g+=`<path class="ar" d="${d} L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z"/>`;
  g+=`<path class="ln" d="${d}"/>`;
  if(pts.length<=40) pts.slice(0,-1).forEach(p=>g+=`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="2.5"/>`);
  const e=pts[pts.length-1];g+=`<circle class="end" cx="${e[0]}" cy="${e[1]}" r="5"/>`;
  const dl=k=>parseKey(k).toLocaleDateString("de-DE",{day:"numeric",month:"short"});
  g+=`<text x="${L}" y="${H-6}">${dl(ws[0].date)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${dl(ws[ws.length-1].date)}</text>`;
  g+=`<g class="scrub" visibility="hidden"><line class="sl" x1="0" x2="0" y1="${T}" y2="${H-B}"/><circle class="sc" r="6" cx="0" cy="0"/></g>`;
  svg.innerHTML=g;
  svg._scrub={pts:ws.map((w,i)=>({x:pts[i][0],y:pts[i][1],date:w.date,kg:w.kg}))};
  bindScrub(svg);
}
function bindScrub(svg){
  if(svg._bound)return;svg._bound=true;
  let active=false;
  const isMain=svg.id==="chart";
  const show=ev=>{
    const sc=svg._scrub;if(!sc||!sc.pts.length)return;
    const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
    const px=(ev.clientX-r.left)*(vb.width/r.width);
    let best=sc.pts[0];sc.pts.forEach(q=>{if(Math.abs(q.x-px)<Math.abs(best.x-px))best=q});
    const gq=svg.querySelector(".scrub");if(!gq)return;
    gq.setAttribute("visibility","visible");
    const ln=gq.querySelector(".sl"),c=gq.querySelector(".sc");
    ln.setAttribute("x1",best.x);ln.setAttribute("x2",best.x);c.setAttribute("cx",best.x);c.setAttribute("cy",best.y);
    const lbl=`${fmt(best.kg,1)} ${UNIT()} · ${parseKey(best.date).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"})}`;
    if(isMain){$("#wNow").textContent=fmt(best.kg,1);$("#wDelta").textContent=parseKey(best.date).toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
    else{let t=svg.querySelector(".stxt");if(!t){t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("class","stxt");svg.appendChild(t)}
      t.textContent=lbl;t.setAttribute("x",Math.min(Math.max(best.x,60),vb.width-60));t.setAttribute("y",12);t.setAttribute("text-anchor","middle")}
  };
  const hide=()=>{active=false;const gq=svg.querySelector(".scrub");if(gq)gq.setAttribute("visibility","hidden");const t=svg.querySelector(".stxt");if(t)t.remove();if(isMain)renderWeight()};
  svg.addEventListener("pointerdown",ev=>{active=true;try{svg.setPointerCapture(ev.pointerId)}catch(e){}show(ev)});
  svg.addEventListener("pointermove",ev=>{if(active)show(ev)});
  svg.addEventListener("pointerup",hide);svg.addEventListener("pointercancel",hide);svg.addEventListener("pointerleave",()=>{if(active)hide()});
}

function sortable(PL,getList,canToggle,rerender){
  rerender=rerender||renderProfileBits;
  PL.onclick=e=>{
    const t=e.target.closest("[data-lt]");if(!t)return;
    const x=getList().find(q=>q.id===t.dataset.lt);if(x&&canToggle(x)){x.on=!x.on;rerender()}
  };
  const moveTo=(i,to)=>{const L=getList();if(to<0||to>=L.length||to===i)return false;const [it]=L.splice(i,1);L.splice(to,0,it);return true};
  PL.addEventListener("keydown",e=>{
    const g=e.target.closest(".grip");if(!g)return;const i=+g.dataset.gi;
    const to=e.key==="ArrowUp"?i-1:e.key==="ArrowDown"?i+1:null;if(to==null)return;
    e.preventDefault();if(moveTo(i,to)){rerender();const n=PL.querySelector(`[data-gi="${to}"]`);n&&n.focus()}
  });
  let drag=null;
  PL.addEventListener("pointerdown",e=>{
    const g=e.target.closest(".grip");if(!g)return;e.preventDefault();
    const rows=[...PL.querySelectorAll(".lrow")],i=+g.dataset.gi,rects=rows.map(r=>r.getBoundingClientRect());
    drag={rows,i,to:i,y0:e.clientY,rects,h:rects[i].height,id:e.pointerId};
    rows[i].classList.add("dragging");try{g.setPointerCapture(e.pointerId)}catch(_){}
  });
  PL.addEventListener("pointermove",e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const {rows,i,rects,h}=drag,first=rects[0].top,last=rects[rects.length-1].bottom;
    const dy=Math.max(first-rects[i].top-h*.4,Math.min(last-rects[i].bottom+h*.4,e.clientY-drag.y0));
    rows[i].style.transform=`translateY(${dy}px)`;
    const c=rects[i].top+h/2+dy;let to=0;
    rects.forEach((r,j)=>{if(j!==i&&r.top+r.height/2<c)to++});
    drag.to=to;
    rows.forEach((r,j)=>{if(j===i)return;r.style.transform=(i<j&&j<=to)?`translateY(${-h}px)`:(to<=j&&j<i)?`translateY(${h}px)`:""});
  });
  const end=e=>{
    if(!drag||(e&&e.pointerId!==drag.id))return;
    const {i,to}=drag;drag=null;moveTo(i,to);rerender();
  };
  PL.addEventListener("pointerup",end);PL.addEventListener("pointercancel",end);
}

function syncFriends(){
  const ids=Object.keys(S.users).filter(id=>id!==S.me&&id!=="local");
  Object.keys(FR).forEach(id=>{if(!ids.includes(id)){FR[id].u1&&FR[id].u1();FR[id].u2&&FR[id].u2();delete FR[id]}});
  const today=keyOf(new Date());
  ids.forEach(id=>{
    if(FR[id])return;
    FR[id]={food:[],weights:[]};
    FR[id].u1=store.food(id,today,l=>{FR[id].food=l;renderFriends()});
    FR[id].u2=store.weights(id,l=>{FR[id].weights=l;renderFriends()});
  });
}
function openFriend(uid){
  let day=keyOf(new Date()),food=(FR[uid]||{food:[]}).food,un=null;
  const p=S.users[uid]||{};
  const draw=()=>{
    const b=$("#sheetBody");if(!b)return;
    const lbl=parseKey(day).toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
    b.innerHTML=`<div class="datebox" style="justify-content:space-between"><button class="arrow" id="fdPrev" aria-label="Vorheriger Tag">‹</button><span class="sec" style="margin:0"><h4>${lbl}</h4></span><button class="arrow" id="fdNext" aria-label="Nächster Tag" ${day>=keyOf(new Date())?'style="visibility:hidden"':""}>›</button></div>`+friendBody(uid,food,day,true);
    const fc=b.querySelector("#fChart");if(fc)drawChart(weightSummary(FR[uid].weights).sorted,fc,90,160);
    b.querySelector("#fdPrev").onclick=()=>shift(-1);b.querySelector("#fdNext").onclick=()=>shift(1);
    const rm=document.createElement("button");rm.className="linkdanger";rm.textContent="Freund entfernen";b.appendChild(rm);
    rm.onclick=()=>{if(rm.dataset.sure){store.removeFriend(uid).then(()=>{closeSheet();toast("Freund entfernt")}).catch(writeErr)}else{rm.dataset.sure="1";rm.textContent="Wirklich entfernen? Nochmal tippen"}};
  };
  const sub=()=>{un&&un();un=store.food(uid,day,l=>{food=l;draw()})};
  const shift=n=>{const d=parseKey(day);d.setDate(d.getDate()+n);if(keyOf(d)>keyOf(new Date()))return;day=keyOf(d);sub()};
  openSheet(p.name||"Freund","",()=>{draw();sub();return()=>{un&&un()}});
}

function go(i){
  S.page=0;
  $("#track").style.transform=`translateX(${-S.page*100}%)`;
  document.querySelectorAll(".dots button").forEach(b=>b.setAttribute("aria-current",String(+b.dataset.p===S.page)));
  if(S.page===0) requestAnimationFrame(renderWeight);
  $("#addRow").classList.toggle("off",S.page!==0);
}
document.querySelectorAll(".dots button").forEach(b=>b.onclick=()=>go(+b.dataset.p));
(function swipe(){return;
  const tr=$("#track"),vp=document.querySelector(".viewport");
  let x0=0,y0=0,dx=0,axis=null,on=false,t0=0;
  vp.addEventListener("touchstart",e=>{
    if(e.target.closest("input,select,.chart,.sheet,.sw")){on=false;return}
    on=true;axis=null;dx=0;t0=Date.now();x0=e.touches[0].clientX;y0=e.touches[0].clientY;
  },{passive:true});
  vp.addEventListener("touchmove",e=>{
    if(!on)return;const t=e.touches[0];dx=t.clientX-x0;const dy=t.clientY-y0;
    if(!axis&&(Math.abs(dx)>8||Math.abs(dy)>8)) axis=Math.abs(dx)>Math.abs(dy)?"x":"y";
    if(axis==="x"){
      let d=dx;if((S.page===0&&d>0)||(S.page===1&&d<0))d*=.3;
      tr.style.transition="none";tr.style.transform=`translateX(calc(${-S.page*100}% + ${d}px))`;
    }
  },{passive:true});
  vp.addEventListener("touchend",()=>{
    if(!on)return;on=false;tr.style.transition="";
    const v=Math.abs(dx)/Math.max(1,Date.now()-t0);
    if(axis==="x"&&(Math.abs(dx)>window.innerWidth*.28||(Math.abs(dx)>24&&v>.45))) go(S.page+(dx<0?1:-1)); else go(S.page);
  });
})();
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#sheet").classList.contains("on")){sheetStack.length?goBack():closeSheet();return}
  if(e.target.closest("input"))return;
  if(e.key==="ArrowRight")go(S.page+1);if(e.key==="ArrowLeft")go(S.page-1);
});

async function saveWeight(date,raw){
  const kg=kgRound(fromU(num(raw)));
  if(kg<20||kg>300){toast(UNIT()==="lb"?"Bitte ein Gewicht zwischen 45 und 660 lb eintragen":"Bitte ein Gewicht zwischen 20 und 300 kg eintragen");return false}
  try{
    await store.setWeight(S.me,date,kg);
    const ws=[...S.weights.filter(w=>w.date!==date),{date,kg}];
    if(latestWeight(ws)===kg&&S.users[S.me]){await store.saveProfile(S.me,{...S.users[S.me],weight:kg})}
    toast(`Gewicht ${fw(kg)} ${UNIT()} eingetragen`);return true;
  }catch(err){writeErr(err);return false}
}

let sheetCleanup=null;
let sheetStack=[],sheetCur=null,navBack=false;
function openSheet(title,html,mount,o){
  o=o||{};
  const isOpen=$("#sheet").classList.contains("on");
  if(isOpen&&!navBack&&!o.replace&&sheetCur) sheetStack.push(sheetCur);
  if(!isOpen) sheetStack=[];
  if(typeof sheetCleanup==="function")sheetCleanup();
  sheetCur=o.reopen||(()=>openSheet(title,html,mount));
  $("#sheetTitle").textContent=title;$("#sheetBody").innerHTML=html;$("#sheetBody").scrollTop=0;
  $("#sheetBack").hidden=!sheetStack.length;
  $("#sheet").classList.add("on");$("#scrim").classList.add("on");
  sheetCleanup=mount?mount($("#sheetBody")):null;
}
function goBack(){
  const fn=sheetStack.pop();if(!fn){closeSheet();return}
  navBack=true;try{fn()}finally{navBack=false}
}
function done(){sheetStack.length?goBack():closeSheet()}
function closeSheet(){sheetStack=[];sheetCur=null;if(S.users[S.me])applyTheme(S.users[S.me].theme);applyWordmark((S.users[S.me]||{}).wmColor);$("#sheet").classList.remove("on");$("#scrim").classList.remove("on");if(typeof sheetCleanup==="function")sheetCleanup();sheetCleanup=null}
$("#sheetX").onclick=closeSheet;$("#sheetBack").onclick=goBack;$("#scrim").onclick=closeSheet;

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const m=1600,s=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.86));
    return{blob,preview:c.toDataURL("image/jpeg",.6)};
  }finally{URL.revokeObjectURL(url)}
}

async function scan(file){
  let ctrl=new AbortController();
  openSheet("Etikett lesen",`<div id="scanPrev"></div><p class="reading">Nährwerte werden gelesen</p>`,()=>()=>ctrl.abort());
  try{
    const {blob,preview}=await shrink(file);
    const pv=$("#scanPrev");if(pv)pv.innerHTML=`<img class="thumb" src="${preview}" alt="Dein Foto">`;
    const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(blob)});
    const {data:r,error}=await SB.functions.invoke("scan",{body:{image:b64}});
    if(error){const e=new Error("fn");e.code=(error.context&&error.context.status===404)?"not_setup":"fn";throw e}
    if(r&&r.error==="not_configured"){const e=new Error("fn");e.code="not_setup";throw e}
    if(!r||r.error){openSheet("Etikett lesen",`<p class="hint">Auf dem Foto war keine Nährwerttabelle zu erkennen${r&&r.error?` (${esc(r.error)})`:""}. Versuch es mit einem schärferen Foto oder trag die Werte manuell ein.</p><button class="btn" id="toManual">Manuell eintragen</button>`,b=>{b.querySelector("#toManual").onclick=()=>foodForm({},{replace:true})},{replace:true});return}

  }
}

async function fetchProduct(code){
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_de,brands,nutriments,serving_quantity`);
  const j=await r.json();
  const n=j&&j.product&&j.product.nutriments;
  if(!j||j.status!==1||!n||n["energy-kcal_100g"]==null&&n["energy_100g"]==null)throw new Error("notfound");
  const p=j.product;const kcal=n["energy-kcal_100g"]!=null?n["energy-kcal_100g"]:n["energy_100g"]/4.184;
  const rd=v=>v==null||v===""?"":Math.round(num(v)*10)/10;
  return{name:[p.product_name_de||p.product_name,p.brands&&p.brands.split(",")[0]].filter(Boolean).join(" · ").slice(0,40)||"Produkt "+code,
    k100:Math.round(num(kcal)),p100:rd(n.proteins_100g),c100:rd(n.carbohydrates_100g),f100:rd(n.fat_100g),serving:p.serving_quantity?Math.round(num(p.serving_quantity)):0,barcode:code};
}

let camStream=null;
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
function barcodeSheet(onResult,o){
  let controls=null,fin=false;
  openSheet("Barcode scannen",`
    <div class="scanbox"><video id="bcVideo" playsinline muted autoplay></video><div class="frame"></div></div>
    <p class="hint" id="bcHint" style="margin:0">Halte den Barcode in den Rahmen.</p>

  b=>{
    const stop=()=>{try{controls&&controls.stop()}catch(e){}stopCam()};
    const go=c=>{if(fin)return;fin=true;stop();lookupBarcode(c,onResult)};
    b.querySelector("#bcGo").onclick=()=>{const c=b.querySelector("#bcCode").value.replace(/\D/g,"");if(c.length<6){toast("Bitte die Barcode-Nummer eintragen");return}go(c)};
    (async()=>{
      try{
        const ZX=await loadZX();if(fin)return;
        if(!camStream)camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false});
        if(fin){stopCam();return}
        const reader=new ZX.BrowserMultiFormatReader();
        controls=await reader.decodeFromStream(camStream,b.querySelector("#bcVideo"),(res)=>{if(res)go(res.getText())});
        if(fin)stop();
      }catch(err){
        console.warn(err);const h=$("#bcHint");
        if(h)h.innerHTML=err&&(err.name==="NotAllowedError"||err.name==="SecurityError")?"Kamera nicht erlaubt. Dauerhaft erlauben: iPhone-<b>Einstellungen → Apps → Safari → Kamera → Erlauben</b>. Oder Nummer eintippen.":"Kamera nicht verfügbar – tipp die Nummer ein.";
      }
    })();
    return()=>{fin=true;stop()};
  },o);
}

/* ---------- Backup als PDF ---------- */
let jsPDFp=null;
function loadJsPDF(){
  if(window.jspdf)return Promise.resolve(window.jspdf.jsPDF);
  return jsPDFp=jsPDFp||new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";sc.onload=()=>res(window.jspdf.jsPDF);sc.onerror=()=>{jsPDFp=null;rej(new Error("load"))};document.head.appendChild(sc)});
}
const b64enc=str=>{const by=new TextEncoder().encode(str);let s="";for(let i=0;i<by.length;i+=0x8000)s+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(s)};
const b64dec=b=>{const s=atob(b);const by=new Uint8Array(s.length);for(let i=0;i<s.length;i++)by[i]=s.charCodeAt(i);return new TextDecoder().decode(by)};
const pdfSafe=t=>String(t??"").replace(/[−–]/g,"-").replace(/[→]/g,"->").replace(/[≈]/g,"ca.").replace(/[·]/g,"|").replace(/[^\x20-\x7E\xA0-\xFF]/g,"");
async function buildBackupPdf(){
  const JsPDF=await loadJsPDF();
  const data=await store.dump(S.me);
  const pkg={app:"nutrac",v:1,at:new Date().toISOString(),...data};
  const p=data.profile||{};
  const doc=new JsPDF({unit:"mm",format:"a4"});
  let y=20;const L=18,line=(t,size=10,bold=false)=>{if(y>280){doc.addPage();y=20}doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);doc.text(pdfSafe(t),L,y);y+=size*.5+2};
  line("Nutrac Backup",20,true);
  line(`${p.name||"Ohne Namen"} - erstellt am ${new Date().toLocaleString("de-DE")}`,10);
  y+=3;line("Diese Datei enthaelt alle deine Nutrac-Daten. Zum Wiederherstellen in Nutrac: Raedchen > Backup wiederherstellen > diese PDF waehlen.",9);
  y+=4;line("Profil",13,true);
  line(`Alter ${p.age||"-"} | Groesse ${p.height||"-"} cm | Gewicht ${p.weight?fmt(p.weight,1):"-"} kg | Ziel ${p.goal==="lose"?"Abnehmen":p.goal==="gain"?"Zunehmen":"Halten"}${p.goalKg?` | Start ${fmt(p.startKg,1)} kg -> Ziel ${fmt(p.goalKg,1)} kg`:""}`);
  y+=3;line(`Gewicht (${data.weight.length} Eintraege)`,13,true);
  [...data.weight].sort((a,b)=>a.date<b.date?1:-1).slice(0,40).forEach(w=>line(`${parseKey(w.date).toLocaleDateString("de-DE")}   ${fmt(w.kg,1)} kg`,9));
  const days={};data.food.forEach(e=>{(days[e.date]=days[e.date]||[]).push(e)});
  y+=3;line(`Tage (${Object.keys(days).length} Tage, ${data.food.length} Eintraege)`,13,true);
  Object.keys(days).sort().reverse().slice(0,60).forEach(k=>{const st=dayStats(days[k]);line(`${parseKey(k).toLocaleDateString("de-DE")}   gegessen ${fmt(st.eaten)} kcal | Sport ${fmt(st.burned)} kcal | E ${fmt(st.P)} KH ${fmt(st.C)} F ${fmt(st.F)}${st.steps!=null?` | ${fmt(st.steps)} Schritte`:""}`,9)});
  y+=3;line(`Lebensmittel (${data.meals.length})`,13,true);data.meals.forEach(m=>line(`${m.name}  ${fmt(m.k100)} kcal/100 g`,9));
  y+=3;line(`Routinen (${data.routines.length})`,13,true);data.routines.forEach(r=>line(`${r.name}  ${fmt(r.kcal)} kcal${r.min?` | ${r.min} min`:""}${(r.days||[]).length?" | "+r.days.map(d=>WD[d-1]).join(" "):""}`,9));
  const buf=new Uint8Array(doc.output("arraybuffer"));
  const b64=b64enc(JSON.stringify(pkg));
  let comment="%NUTRAC-BACKUP-BEGIN\n";for(let i=0;i<b64.length;i+=200)comment+="%NB:"+b64.slice(i,i+200)+"\n";comment+="%NUTRAC-BACKUP-END\n";
  const extra=new TextEncoder().encode(comment);
  const SX=[115,116,97,114,116,120,114,101,102];let pos=-1;for(let i=buf.length-SX.length;i>=0;i--){if(SX.every((c,k)=>buf[i+k]===c)){pos=i;break}}
  if(pos<0)pos=buf.length;
  const out=new Uint8Array(buf.length+extra.length);out.set(buf.subarray(0,pos),0);out.set(extra,pos);out.set(buf.subarray(pos),pos+extra.length);
  return{bytes:out,count:data.food.length+data.weight.length};
}
async function sharePdf(bytes,fname,title){
  const file=new File([bytes],fname,{type:"application/pdf"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title});return true}catch(e){if(e&&e.name==="AbortError")return false;throw e}
  }
  const url=URL.createObjectURL(file);const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return true;
}
async function weekReport(back,btn){
  const p=S.users[S.me];if(!p){toast("Leg zuerst dein Profil an");return}
  if(btn){btn.disabled=true;btn.dataset.l=btn.textContent;btn.textContent="Erstelle PDF …"}
  try{
    const JsPDF=await loadJsPDF();
    const mon=new Date();mon.setHours(12);mon.setDate(mon.getDate()-((mon.getDay()+6)%7)-7*back);
    const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return keyOf(d)});
    const food=await store.foodRange(S.me,days[0],days[6]);
    const pl=plan(p,latestWeight(S.weights));
    const U=p.unit||"kg";
    const doc=new JsPDF({unit:"mm",format:"a4"});
    const W=210,L=16,R=W-16;let y=18;
    const T=(t,x,yy,o)=>doc.text(pdfSafe(t),x,yy,o);
    const page=need=>{if(y+need>285){doc.addPage();y=18}};
    doc.setFont("helvetica","bold");doc.setFontSize(20);T("Nutrac Wochenbericht",L,y);y+=8;
    doc.setFont("helvetica","normal");doc.setFontSize(10);
    const dl=k=>parseKey(k).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
    T(`${p.name||""}  |  ${parseKey(days[0]).toLocaleDateString("de-DE")} - ${parseKey(days[6]).toLocaleDateString("de-DE")}  |  erstellt ${new Date().toLocaleDateString("de-DE")}`,L,y);y+=10;
    // Tabelle Bilanz
    const cols=[L,L+30,L+58,L+82,L+108,L+140];
    doc.setFont("helvetica","bold");doc.setFontSize(9);
    ["Tag","Gegessen","Sport","Schritte","Bedarf gesamt","Bilanz"].forEach((h,i)=>T(h,cols[i],y));y+=2;
    doc.setLineWidth(.3);doc.line(L,y,R,y);y+=5;doc.setFont("helvetica","normal");
    let sumE=0,sumB=0,sumBal=0,nDays=0,sP=0,sC=0,sF=0;
    const rows=days.map(k=>{const es=food.filter(e=>e.date===k);const st=dayStats(es);const sp=stepsOf(pl,st);
      const need=pl?pl.tdee+st.burned+sp.k:0;const has=st.foods.length>0;const bal=has&&pl?need-st.eaten:null;
      if(has){sumE+=st.eaten;sumB+=need;sumBal+=bal||0;nDays++;sP+=st.P;sC+=st.C;sF+=st.F}
      return{k,st,sp,need,bal,has}});
    rows.forEach(r=>{
      T(dl(r.k),cols[0],y);T(r.has?fmt(r.st.eaten)+" kcal":"-",cols[1],y);T(r.st.burned?"+"+fmt(r.st.burned):"-",cols[2],y);
      T(r.st.steps!=null?fmt(r.st.steps):(r.sp.on?"Std.":"-"),cols[3],y);T(pl?fmt(r.need)+" kcal":"-",cols[4],y);
      T(r.bal==null?"-":(r.bal>=0?"Defizit "+fmt(r.bal):"Ueberschuss "+fmt(-r.bal)),cols[5],y);y+=6});
    doc.line(L,y-3,R,y-3);y+=3;
    doc.setFont("helvetica","bold");doc.setFontSize(11);
    T(`Wochenbilanz: ${sumBal>=0?"Defizit":"Ueberschuss"} ${fmt(Math.abs(sumBal))} kcal  (ca. ${fmt(toU(Math.abs(sumBal)/KCAL_PER_KG,U),2)} ${U})`,L,y);y+=6;
    doc.setFont("helvetica","normal");doc.setFontSize(10);
    if(nDays)T(`Durchschnitt pro Tag mit Eintraegen (${nDays}): ${fmt(sumE/nDays)} kcal gegessen | E ${fmt(sP/nDays)} g | KH ${fmt(sC/nDays)} g | F ${fmt(sF/nDays)} g`,L,y),y+=6;
    if(pl)T(`Tagesziel: ${fmt(pl.target)} kcal (+ Sport/Schritte) | Ziel: ${p.goal==="lose"?"Abnehmen":p.goal==="gain"?"Zunehmen":"Halten"}`,L,y),y+=6;
    const wk=S.weights.filter(w=>w.date>=days[0]&&w.date<=days[6]).sort((a,b)=>a.date<b.date?-1:1);
    if(wk.length)T(`Gewicht: ${wk.map(w=>`${dl(w.date)} ${fmt(toU(w.kg,U),1)} ${U}`).join("  |  ")}`,L,y),y+=6;
    y+=4;
    // Was gegessen
    doc.setFont("helvetica","bold");doc.setFontSize(13);T("Was du gegessen hast",L,y);y+=7;
    rows.forEach(r=>{
      const es=[...r.st.foods,...r.st.sports].sort((a,b)=>(a.t||0)-(b.t||0));
      page(14);doc.setFont("helvetica","bold");doc.setFontSize(10);
      T(`${parseKey(r.k).toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}`,L,y);
      T(r.has?`${fmt(r.st.eaten)} kcal`:"",R,y,{align:"right"});y+=5;
      doc.setFont("helvetica","normal");doc.setFontSize(9);
      if(!es.length){T("keine Eintraege",L+4,y);y+=6;return}
      es.forEach(e=>{page(6);
        const tm=e.t?new Date(e.t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):"";
        const amt=e.kind==="sport"?(e.min?fmt(e.min)+" min Sport":"Sport"):amountOf(e);
        T(tm,L+4,y);T(String(e.name||"Eintrag").slice(0,38),L+18,y);T(amt,L+95,y);
        T(e.kind==="sport"?"+"+fmt(e.kcal)+" kcal":fmt(e.kcal)+" kcal",L+130,y);
        if(e.kind!=="sport")T(`E ${fmt(e.p)} KH ${fmt(e.c)} F ${fmt(e.f)}`,R,y,{align:"right"});
        y+=5});
      y+=3});
    const bytes=new Uint8Array(doc.output("arraybuffer"));
    const fname=`Nutrac-Woche-${days[0]}.pdf`;
    const ok=await sharePdf(bytes,fname,"Nutrac Wochenbericht");
    toast(ok?"Wochenbericht erstellt":"Nicht gespeichert");
  }catch(err){console.warn(err);toast(err&&err.message==="load"?"PDF konnte nicht geladen werden – Internet prüfen":"Bericht hat nicht geklappt")}
  finally{if(btn){btn.disabled=false;btn.textContent=btn.dataset.l}}
}
async function saveBackup(btn){

    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:"Nutrac Backup"});ok=true}catch(e){if(e&&e.name==="AbortError"){const x=new Error("declined");x.code="declined";throw x}throw e}
    }else{
      const url=URL.createObjectURL(file);const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);ok=true;
    }
    if(ok){
      const p=S.users[S.me];if(p){const np={...p,lastBackup:Date.now()};S.users={...S.users,[S.me]:np};await store.saveProfile(S.me,np)}
      toast("Backup gespeichert");renderBackup();const bs=$("#bkStatus");if(bs)bs.textContent=backupText();
    }
  }catch(err){
    console.warn(err);
    if(err&&err.code==="declined")toast("Backup nicht gespeichert");
    else if(err&&err.message==="load")toast("PDF-Erstellung konnte nicht geladen werden – Internet prüfen");
    else toast("Backup hat nicht geklappt"+(err&&err.code?" ("+err.code+")":""));
  }finally{if(btn){btn.disabled=false;btn.textContent=btn.dataset.l}}
}
function backupText(){const lb=(S.users[S.me]||{}).lastBackup;if(!lb)return"Noch kein Backup gespeichert.";const d=Math.floor((Date.now()-lb)/864e5);return`Letztes Backup: ${new Date(lb).toLocaleDateString("de-DE",{day:"numeric",month:"long"})} (${d===0?"heute":d===1?"gestern":"vor "+d+" Tagen"})`}
function renderBackup(){
  const el=$("#bkpCard");if(!el)return;const p=S.users[S.me];
  let snooze=0;try{snooze=+localStorage.getItem("nutrac-bkp-snooze")||0}catch(e){}
  const due=p&&S.canWrite&&(Date.now()-(p.lastBackup||0)>7*864e5)&&Date.now()>snooze&&(S.food.length||S.weights.length||p.lastBackup);
  if(!due){el.hidden=true;return}
  el.hidden=false;
  el.innerHTML=`<span class="t"><b>Wochen-Backup</b>${p.lastBackup?backupText():"Sichere deine Daten einmal pro Woche als PDF."}</span><button class="btn" id="bkNow">Sichern</button><button class="later" id="bkLater">Später</button>`;
  $("#bkNow").onclick=e=>saveBackup(e.currentTarget);
  $("#bkLater").onclick=()=>{try{localStorage.setItem("nutrac-bkp-snooze",String(Date.now()+864e5))}catch(e){}el.hidden=true};
}
async function readBackupFile(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  let txt="";for(let i=0;i<buf.length;i+=0x8000)txt+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  const parts=[...txt.matchAll(/%NB:([A-Za-z0-9+/=]+)/g)].map(m=>m[1]);
  if(!parts.length)throw new Error("nobackup");
  const pkg=JSON.parse(b64dec(parts.join("")));
  if(!pkg||pkg.app!=="nutrac")throw new Error("nobackup");
  return pkg;
}
function restoreSheet(pkg){
  const at=new Date(pkg.at).toLocaleString("de-DE",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
  openSheet("Wiederherstellen",`
    <div class="card calc">
      <div><span>Backup vom</span><span class="num">${esc(at)}</span></div>
      <div><span>Profil</span><span class="num">${esc((pkg.profile&&pkg.profile.name)||"–")}</span></div>
      <div><span>Einträge (Essen, Sport, Schritte)</span><span class="num">${fmt(pkg.food.length)}</span></div>
      <div><span>Gewichte</span><span class="num">${fmt(pkg.weight.length)}</span></div>
      <div><span>Lebensmittel · Routinen</span><span class="num">${fmt(pkg.meals.length)} · ${fmt(pkg.routines.length)}</span></div>
    </div>
    <p class="hint">Alles aus dem Backup wird in dein Konto zurückgeschrieben. Einträge, die es jetzt schon gibt, bleiben erhalten.</p>
    <button class="btn" id="rsGo">Wiederherstellen</button>
    <p class="hint" id="rsStatus" aria-live="polite"></p>`,
  b=>{b.querySelector("#rsGo").onclick=async e=>{
    const btn=e.currentTarget;btn.disabled=true;const stEl=b.querySelector("#rsStatus");
    const jobs=[];
    if(pkg.profile)jobs.push(["",null,{...pkg.profile,...(S.users[S.me]&&S.users[S.me].lastBackup?{lastBackup:S.users[S.me].lastBackup}:{})}]);
    pkg.weight.forEach(w=>jobs.push(["weight",w.date,{date:w.date,kg:w.kg}]));
    ["food","meals","routines"].forEach(c=>pkg[c].forEach(x=>{const {id,...d}=x;jobs.push([c,id,d])}));
    let n=0;
    try{
      for(const [c,id,d] of jobs){await store.put(S.me,c||null,id,d);n++;if(n%10===0)stEl.textContent=`Schreibe ${n} von ${jobs.length} …`}
      stEl.textContent=`Fertig – ${n} Datensätze wiederhergestellt.`;toast("Backup wiederhergestellt");setTimeout(closeSheet,900);
    }catch(err){console.warn(err);stEl.textContent=`Abgebrochen nach ${n} von ${jobs.length}. Nochmal versuchen – bereits Geschriebenes bleibt.`;btn.disabled=false}
  }});
}

async function deleteKey(key){
  const [kind,id]=[key.slice(0,1),key.slice(2)];
  try{
    if(kind==="e"){const e=S.food.find(x=>x.id===id);if(!e)return;const copy={...e};delete copy.id;
      await store.delFood(S.me,id);toast(`${e.kind==="steps"?"Schritte":e.name||"Eintrag"} gelöscht`,{label:"Rückgängig",fn:async()=>{try{await store.setEntry(S.me,id,copy)}catch(err){writeErr(err)}}})}
    else if(kind==="w"){const w=S.weights.find(x=>x.date===id);if(!w)return;
      await store.delWeight(S.me,id);toast("Gewicht gelöscht",{label:"Rückgängig",fn:async()=>{try{await store.setWeight(S.me,w.date,w.kg)}catch(err){writeErr(err)}}});
      if($("#sheet").classList.contains("on")&&sheetCur)setTimeout(()=>{navBack=true;try{sheetCur()}finally{navBack=false}},150)}
  }catch(err){writeErr(err)}
}
(function swipeRows(){
  let st=null;const W=96;
  const closeAll=ex=>document.querySelectorAll(".sw.open").forEach(x=>{if(x!==ex){x.classList.remove("open");x.querySelector(".row").style.transform=""}});
  document.addEventListener("touchstart",e=>{
    const sw=e.target.closest(".sw");
    if(!sw){closeAll();st=null;return}
    if(e.target.closest(".swdel"))return;
    closeAll(sw);
    st={sw,row:sw.querySelector(".row"),x0:e.touches[0].clientX,y0:e.touches[0].clientY,dx:0,axis:null,base:sw.classList.contains("open")?-W:0};
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!st)return;const t=e.touches[0];const dx=t.clientX-st.x0,dy=t.clientY-st.y0;
    if(!st.axis&&(Math.abs(dx)>8||Math.abs(dy)>8))st.axis=Math.abs(dx)>Math.abs(dy)?"x":"y";
    if(st.axis!=="x")return;
    let x=Math.min(0,st.base+dx);const wdt=st.sw.clientWidth;if(x<-W)x=-W+(x+W)*.6;
    st.dx=x;st.sw.classList.add("drag");st.row.style.transform=`translateX(${x}px)`;
  },{passive:true});
  document.addEventListener("touchend",()=>{
    if(!st)return;const {sw,row,dx,axis}=st;st=null;sw.classList.remove("drag");
    if(axis!=="x")return;
    swipeUsed=Date.now();
    if(dx<-sw.clientWidth*.6){row.style.transform=`translateX(${-sw.clientWidth}px)`;deleteKey(sw.dataset.sw);return}
    if(dx<-W/2){sw.classList.add("open");row.style.transform=`translateX(${-W}px)`}else{sw.classList.remove("open");row.style.transform=""}
  });
  document.addEventListener("click",e=>{
    const d=e.target.closest(".swdel");if(d){e.stopPropagation();e.preventDefault();deleteKey(d.closest(".sw").dataset.sw);return}
    const sw=e.target.closest(".sw.open");if(sw){e.stopPropagation();e.preventDefault();sw.classList.remove("open");sw.querySelector(".row").style.transform="";return}
    if(Date.now()-swipeUsed<350){e.stopPropagation();e.preventDefault()}
  },true);
})();
var swipeUsed=0;
(function sheetGestures(){
  const sh=$("#sheet");let g=null;
  sh.addEventListener("touchstart",e=>{
    if(e.target.closest(".sw,input,textarea,.grip,.days"))return;
    const t=e.touches[0],body=$("#sheetBody"),r=sh.getBoundingClientRect();
    const inTop=t.clientY-r.top<70;
    g={x0:t.clientX,y0:t.clientY,axis:null,top:inTop||body.scrollTop<=0,edge:t.clientX<28&&sheetStack.length>0,dy:0,dx:0,t0:Date.now()};
  },{passive:true});
  sh.addEventListener("touchmove",e=>{
    if(!g)return;const t=e.touches[0];g.dx=t.clientX-g.x0;g.dy=t.clientY-g.y0;
    if(!g.axis&&(Math.abs(g.dx)>10||Math.abs(g.dy)>10)){g.axis=Math.abs(g.dx)>Math.abs(g.dy)*1.2?"x":"y";
      if(g.axis==="y"&&g.dy<0)g.top=false; // nach oben wischen = normal scrollen
      if(g.axis==="x"&&!g.edge){g=null;return}}
    if(g.axis==="y"&&g.top){e.cancelable&&e.preventDefault();const d=Math.max(0,g.dy-10);sh.classList.add("drag");sh.style.transform=`translateY(${d}px)`}
    else if(g.axis==="x"&&g.edge){e.cancelable&&e.preventDefault();$("#sheetBody").style.transform=`translateX(${Math.max(0,g.dx)*.6}px)`}
  },{passive:false});
  sh.addEventListener("touchend",()=>{
    if(!g)return;const v=g.dy/Math.max(1,Date.now()-g.t0);
    sh.classList.remove("drag");sh.style.transform="";$("#sheetBody").style.transform="";
    if(g.axis==="y"&&g.top&&(g.dy>130||(g.dy>40&&v>.6)))closeSheet();
    else if(g.axis==="x"&&g.edge&&g.dx>80)goBack();
    g=null;
  });
})();

["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));

/* ---------- Start ---------- */
let readyDone;const ready=new Promise(r=>readyDone=r);
let SB=null;
const T0=Date.now();
function hideSplash(){const w=600-(Date.now()-T0);if(w>0){setTimeout(hideSplash,w);return}const sp=document.getElementById("splash");if(!sp||sp.classList.contains("out"))return;sp.classList.add("out");setTimeout(()=>sp.remove(),400)}
setTimeout(hideSplash,8000);
function showLogin(msg){hideSplash();
  const L=$("#login");L.hidden=false;let mode="in";
  const sw=$("#lgSwitch"),go=$("#lgGo"),er=$("#lgErr");if(msg)er.textContent=msg;
  const setMode=m=>{mode=m;go.textContent=m==="in"?"Anmelden":"Konto erstellen";sw.textContent=m==="in"?"Noch kein Konto? Konto erstellen":"Schon ein Konto? Anmelden";$("#lgPw").autocomplete=m==="in"?"current-password":"new-password";er.textContent=""};
  sw.onclick=()=>setMode(mode==="in"?"up":"in");
  const submit=async()=>{
    const email=$("#lgMail").value.trim(),password=$("#lgPw").value;
    if(!/^\S+@\S+\.\S+$/.test(email)){er.textContent="Bitte eine gültige E-Mail eingeben.";return}
    if(password.length<6){er.textContent="Das Passwort braucht mindestens 6 Zeichen.";return}
    go.disabled=true;er.textContent="";try{localStorage.setItem("nutrac-last-mail",email)}catch(e){}
    try{
      const r=mode==="in"?await SB.auth.signInWithPassword({email,password}):await SB.auth.signUp({email,password});
      if(r.error)throw r.error;
      if(!r.data.session&&mode==="up"){const r2=await SB.auth.signInWithPassword({email,password});if(!r2.error&&r2.data.session){location.reload();return}}
      if(!r.data.session){er.style.color="var(--muted)";er.textContent="Fast geschafft: Bestätige den Link in deiner E-Mail und melde dich dann hier an.";setMode("in");go.disabled=false;return}
      location.reload();
    }catch(e){console.warn(e);er.style.color="";const m=String(e&&e.message||"");
      er.textContent=/Invalid login/i.test(m)?"E-Mail oder Passwort stimmt nicht.":/registered/i.test(m)?"Diese E-Mail hat schon ein Konto – bitte anmelden.":/confirm/i.test(m)?"Bitte bestätige zuerst den Link in deiner E-Mail.":navigator.onLine===false?"Kein Internet.":"Hat nicht geklappt: "+m;
      go.disabled=false}
  };
  try{const lm=localStorage.getItem("nutrac-last-mail");if(lm&&!$("#lgMail").value)$("#lgMail").value=lm}catch(e){}
  go.onclick=submit;$("#lgPw").onkeydown=e=>{if(e.key==="Enter")submit()};
}
/* Angemeldet bleiben: Sitzung in localStorage UND in Cookies (1 Jahr).
   iOS übernimmt Safari-Cookies beim "Zum Home-Bildschirm", so bleibt man auch in der App angemeldet. */
const keepStore=(function(){
  const CH=2800,AGE=60*60*24*365,base=`; path=${location.pathname.replace(/[^/]*$/,"")}; max-age=`;
  const rd=()=>{const o={};document.cookie.split("; ").forEach(c=>{const i=c.indexOf("=");if(i>0)o[c.slice(0,i)]=c.slice(i+1)});return o};
  const clearC=k=>{const all=rd();Object.keys(all).filter(n=>n===k+"_n"||n.startsWith(k+"_")).forEach(n=>{document.cookie=n+"="+base+"0"})};
  const setC=(k,v)=>{clearC(k);const e=encodeURIComponent(v);const n=Math.ceil(e.length/CH);for(let i=0;i<n;i++)document.cookie=`${k}_${i}=${e.slice(i*CH,(i+1)*CH)}${base}${AGE}; SameSite=Lax; Secure`;document.cookie=`${k}_n=${n}${base}${AGE}; SameSite=Lax; Secure`};
  const getC=k=>{const all=rd();const n=+all[k+"_n"]||0;if(!n)return null;let e="";for(let i=0;i<n;i++){if(all[k+"_"+i]==null)return null;e+=all[k+"_"+i]}try{return decodeURIComponent(e)}catch(_){return null}};
  return{
    getItem(k){let v=null;try{v=localStorage.getItem(k)}catch(e){}if(v==null){v=getC(k);if(v!=null)try{localStorage.setItem(k,v)}catch(e){}}return v},
    setItem(k,v){try{localStorage.setItem(k,v)}catch(e){}try{setC(k,v)}catch(e){}},
    removeItem(k){try{localStorage.removeItem(k)}catch(e){}try{clearC(k)}catch(e){}}
  };
})();

/* ---------- Einladung per Link ---------- */
const INV_KEY="nutrac-invite";
let INV=null;try{const q=new URLSearchParams(location.search).get("e");if(q&&/^[A-Za-z0-9]{6}$/.test(q)){localStorage.setItem(INV_KEY,q.toUpperCase());history.replaceState(null,"",location.pathname+location.hash)}INV=localStorage.getItem(INV_KEY)}catch(e){}
const clearInv=()=>{INV=null;try{localStorage.removeItem(INV_KEY)}catch(e){}};
async function showInvite(){
  const V=$("#invite");V.hidden=false;let who=null;
  try{const {data}=await SB.rpc("invite_info",{code:INV});if(data){who=data.name;if(!data.valid){$("#ivTitle").textContent="Diese Einladung ist abgelaufen";$("#ivSub").textContent=`Frag ${who||"deinen Freund"} nach einem neuen Link – oder schau dir Nutrac trotzdem an.`;$("#ivYes").textContent="Zu Nutrac";clearInv();who=null}}}catch(e){console.warn(e)}
  if(who){$("#ivTitle").textContent=`${who} hat dich eingeladen`;$("#ivSub").textContent=`Tracke Kalorien und Gewicht – gemeinsam mit ${who}.`}
  const go=mode=>{V.hidden=true;showLogin();if(INV)$("#lgIntro").textContent=`Einladung von ${who||"deinem Freund"} – nach der Anmeldung seid ihr direkt befreundet.`;if(mode==="up")$("#lgSwitch").click()};
  $("#ivYes").onclick=()=>go("up");$("#ivHave").onclick=()=>go("in");
}
async function acceptInvite(){
  if(!INV)return;const code=INV;
  try{const {data,error}=await SB.rpc("accept_invite",{code});if(error)throw error;
    if(data==="auth")return;
    clearInv();
    if(data==="ok"){toast("Ihr seid jetzt befreundet");store.refresh()}
    else if(data==="already")toast("Ihr seid schon befreundet");
    else if(data==="expired")toast("Die Einladung ist abgelaufen – frag nach einem neuen Link");
    else if(data==="not_found")toast("Einladung nicht gefunden");
    if(!isStandalone()&&/iPhone|iPad/.test(navigator.userAgent))setTimeout(homeHint,900);
  }catch(e){console.warn(e)}
}
function homeHint(){
  openSheet("Nutrac aufs iPhone",`<div class="card form"><p style="margin:0;font-size:15px;line-height:1.5">So hast du Nutrac wie eine App auf dem Home-Bildschirm:</p>
  <p style="margin:0;font-size:15px;line-height:1.7">1. Unten in Safari auf <b>Teilen</b> tippen (Quadrat mit Pfeil)<br>2. <b>Zum Home-Bildschirm</b> wählen<br>3. <b>Hinzufügen</b> – fertig</p>
  <p class="hint" style="margin:0">Danach Nutrac immer über das Icon öffnen.</p></div><button class="btn" id="hhOk">Verstanden</button>`,b=>{b.querySelector("#hhOk").onclick=closeSheet});
}
(async function boot(){
  const C=window.NUTRAC_CONFIG||{};
  if(!window.supabase||!C.SUPABASE_URL||/DEIN|YOUR/.test(C.SUPABASE_URL)){showLogin("Nutrac ist noch nicht eingerichtet: Trag in config.js deine Supabase-Adresse und den Schlüssel ein (Anleitung, Schritt 2).");$("#lgGo").disabled=true;return}
  try{if(!keepStore.getItem("nutrac-auth")){const ok=Object.keys(localStorage).find(k=>/^sb-.*-auth-token$/.test(k));if(ok)keepStore.setItem("nutrac-auth",localStorage.getItem(ok))}}catch(e){}
  SB=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"nutrac-auth",storage:keepStore}});
  let session=null;try{session=(await SB.auth.getSession()).data.session}catch(e){console.warn(e)}
  if(!session){try{const raw=keepStore.getItem("nutrac-auth");const j=raw&&JSON.parse(raw);if(j&&j.user&&j.refresh_token){const r=await SB.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});session=r.data.session||null;if(!session&&navigator.onLine===false)session=j}}catch(e){console.warn(e)}}
  if(!session){if(INV)showInvite();else showLogin();return}
  SB.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT")location.reload()});
  S.me=session.user.id;S.email=session.user.email;S.view=S.me;
  store.init(SB);
  render();readyDone();
  acceptInvite();
  store.meals(S.me,list=>{S.meals=list;if($("#sheet").classList.contains("on")&&(sheetCur===openAdd||sheetCur===savedSheet)){const f=sheetCur;navBack=true;try{f()}finally{navBack=false}}});
  store.routines(S.me,list=>{S.routines=list;renderPlan()});
  let histFrom=null,histUn=null;
  const subHist=()=>{
    const hf=new Date();hf.setDate(hf.getDate()-60);let from=keyOf(hf);
    const sd=S.users[S.me]&&S.users[S.me].startDate;if(sd&&sd<from)from=sd;
    if(from===histFrom)return;histFrom=from;histUn&&histUn();
    histUn=store.foodSince(S.me,from,list=>{S.hist=list;renderGoal()});
  };
  subHist();
  let tzDone=false;
  store.users(o=>{S.users=o;subHist();S.view=S.me;syncFriends();render();hideSplash();
    const p=o[S.me];if(!tzDone&&p){tzDone=true;if(p.tz!==myTz())store.saveProfile(S.me,{...p,tz:myTz()}).catch(()=>{})}});
  store.requests(list=>{S.requests=list;renderFriends()});
  resubscribe();
  syncPush();
  if(location.hash){const h=location.hash;history.replaceState(null,"",location.pathname);setTimeout(()=>{if(h==="#friends")openFriends();else if(h==="#backup")openSettings()},300)}
  if("serviceWorker" in navigator)navigator.serviceWorker.addEventListener("message",e=>{const u=e.data&&e.data.nav;if(!u)return;if(/#friends/.test(u))openFriends();else if(/#backup/.test(u))openSettings()});
  if("serviceWorker" in navigator&&location.protocol==="https:"){
    navigator.serviceWorker.register("sw.js").then(reg=>{
      const chk=()=>reg.update().catch(()=>{});
      document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()});setInterval(chk,60000);
    }).catch(()=>{});
    // neue Version da: neu laden, sobald gerade kein Fenster offen ist
    let pending=false;
    const tryReload=()=>{if(pending&&!$("#sheet").classList.contains("on"))location.reload()};
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!navigator.serviceWorker.controller)return;pending=true;tryReload()});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)tryReload()});
    $("#sheetX").addEventListener("click",()=>setTimeout(tryReload,450));
  }
})();
})();
